[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meshdata"
version = "0.2.0"
description = "schema.org for micron: structured type/metadata for NomadNet pages, for mesh crawlers."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "wdunn001" }]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/wdunn001/meshdata"

[tool.setuptools]
packages = ["meshdata"]
